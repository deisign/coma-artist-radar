name: Deploy coma.fm Radar to GitHub Pages

on:
  schedule:
    - cron: "5 6 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install pytest PyYAML

      - name: Run tests
        run: python -m pytest -q tests

      - name: Set issue date
        run: echo "ISSUE_DATE=$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Build daily draft site
        run: |
          python scripts/build_daily_draft.py \
            --date "$ISSUE_DATE" \
            --fetch-limit 50 \
            --issue-limit 10 \
            --publish \
            --validate \
            --base-url https://radar.coma.fm \
            --base-path ""
          printf 'radar.coma.fm\n' > dist/CNAME

      - name: Assert public issue quality
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          issue_date = os.environ['ISSUE_DATE']
          for lang in ('en', 'uk'):
              path = Path(f'content/issues/{issue_date}.{lang}.json')
              data = json.loads(path.read_text(encoding='utf-8'))
              items = data.get('items', [])
              if data.get('draft') is not False:
                  raise SystemExit(f'{path}: expected draft=false')
              if len(items) != 10:
                  raise SystemExit(f'{path}: expected 10 items, got {len(items)}')
          PY

      - name: Commit published issue state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/published_items.json content/issues/${ISSUE_DATE}.en.json content/issues/${ISSUE_DATE}.uk.json
          if git diff --cached --quiet; then
            echo "No published issue state changes to commit."
          else
            git commit -m "Record published Radar issue ${ISSUE_DATE} [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
